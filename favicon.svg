  <rect width="64" height="64" rx="14" fill="#0b0e14"/>
  <g transform="translate(32 32) scale(1.28)" fill="none" stroke="#f5a524" stroke-width="1.4" stroke-linejoin="round">
    <polygon points="7,0 3.5,6.06 -3.5,6.06 -7,0 -3.5,-6.06 3.5,-6.06" transform="translate(0 -12.12)"/>
    <polygon points="7,0 3.5,6.06 -3.5,6.06 -7,0 -3.5,-6.06 3.5,-6.06" transform="translate(10.5 -6.06)"/>
    <polygon points="7,0 3.5,6.06 -3.5,6.06 -7,0 -3.5,-6.06 3.5,-6.06" transform="translate(10.5 6.06)"/>
    <polygon points="7,0 3.5,6.06 -3.5,6.06 -7,0 -3.5,-6.06 3.5,-6.06" transform="translate(0 12.12)"/>
    <polygon points="7,0 3.5,6.06 -3.5,6.06 -7,0 -3.5,-6.06 3.5,-6.06" transform="translate(-10.5 6.06)"/>
    <polygon points="7,0 3.5,6.06 -3.5,6.06 -7,0 -3.5,-6.06 3.5,-6.06" transform="translate(-10.5 -6.06)"/>
  </g>
  <polygon points="7,0 3.5,6.06 -3.5,6.06 -7,0 -3.5,-6.06 3.5,-6.06" transform="translate(32 32) scale(1.28)" fill="#f5a524"/>
